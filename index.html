/* Layout concept: one full-bleed canvas garden. Bark-framed plaques and panels sit on it like objects set on a table: a timer dock bottom-left, a slide-in drawer (shop / journey / mood) on the right. Moss grows only on the main pieces. */
:root{
  --night:#0b1517;
  --bark-tex:repeating-linear-gradient(90deg,rgba(0,0,0,.24) 0 2px,transparent 2px 7px),repeating-linear-gradient(93deg,rgba(255,230,190,.07) 0 1px,transparent 1px 11px),linear-gradient(#69493a,#4f372a);
  --frame-hi:rgba(255,226,190,.3);--frame-lo:#3d2a1f;
  --ol:#1f140c;--ol-soft:#6b5a38;
  --on-frame:#f2ebcf;--on-frame-soft:#cfc7a0;
  --paper:#e7ddba;--paper-2:#dacda0;--paper-3:#c7ba88;--sel-bg:#ecdc9a;
  --ink:#32291a;--ink-soft:#6c5f3e;
  --moss:#6f9b49;--moss-l:#9fca6c;--moss-d:#3e6a2a;
  --gold:#dfa63e;--gold-hi:#f4cb78;--gold-d:#97691a;
  --clay:#b6654b;--clay-l:#dc9378;--clay-d:#7f3d2a;
  --text:var(--ink);--muted:var(--ink-soft);--lantern:#8a5c12;--danger:#a64b36;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .34  0 0 0 0 .22  0 0 0 0 .09  0 0 0 .34 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fiber:repeating-linear-gradient(96deg,rgba(100,70,30,.06) 0 1px,transparent 1px 9px),repeating-linear-gradient(8deg,rgba(255,255,255,.07) 0 1px,transparent 1px 13px);
  --ptex:var(--fiber),var(--noise);
  --px:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --serif:'Alegreya','Iowan Old Style',Georgia,serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --pv-top:#cfd2a6;--pv-bot:#b9bd8a;--pv-ground:rgba(80,120,50,.6);
  --moss-clump:radial-gradient(circle at 5% 72%,#5f8c3e 0 8px,transparent 8.5px),radial-gradient(circle at 10% 58%,#7aa851 0 7px,transparent 7.5px),radial-gradient(circle at 15% 78%,#6f9b49 0 6px,transparent 6.5px),radial-gradient(circle at 20% 64%,#93bf62 0 4.5px,transparent 5px),radial-gradient(circle at 74% 70%,#6f9b49 0 6px,transparent 6.5px),radial-gradient(circle at 79% 56%,#86b25a 0 8px,transparent 8.5px),radial-gradient(circle at 85% 74%,#5f8c3e 0 7px,transparent 7.5px),radial-gradient(circle at 91% 60%,#7aa851 0 6px,transparent 6.5px),radial-gradient(circle at 96% 76%,#6a9645 0 5px,transparent 5.5px);
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --gt:env(safe-area-inset-top,0px);
  --gb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--moss-l);outline-offset:2px;border-radius:10px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--night)}
#scene.drag{cursor:grabbing}
#scene.place{cursor:copy}

/* ---------- surfaces ---------- */
/* bark plaque: header pieces, toasts, hints */
.glass{background:var(--bark-tex);border:3px solid var(--ol);border-radius:16px;box-shadow:inset 0 3px 0 var(--frame-hi),inset 0 -4px 0 var(--frame-lo),0 5px 0 var(--ol),0 14px 22px rgba(5,10,8,.42);color:var(--on-frame);text-shadow:0 2px 0 var(--ol)}
/* framed paper: drawer, dock, inspector, dialogs. Bark outside, recessed oat paper inside. */
.panel,.dock,.insp,.modal{background:var(--bark-tex);border:3px solid var(--ol);border-radius:20px;padding:12px;box-shadow:inset 0 3px 0 var(--frame-hi),inset 0 -5px 0 var(--frame-lo),0 7px 0 var(--ol),0 18px 26px rgba(5,10,8,.45);color:var(--ink);text-shadow:none}
.panel::before,.dock::before,.insp::before,.modal::before{content:"";position:absolute;inset:10px;background:var(--ptex),var(--paper);border:2.5px solid var(--ol-soft);border-radius:11px;box-shadow:inset 0 4px 0 rgba(90,55,20,.22),inset 0 0 0 2px rgba(255,248,225,.35);pointer-events:none;z-index:0}
.panel>*,.dock>*,.insp>*,.modal>*{position:relative;z-index:1}
/* moss: only on the main pieces */
.panel::after,.dock::after,.modal::after,.brand::after{content:"";position:absolute;pointer-events:none;z-index:3;left:16px;right:16px;top:-9px;height:22px;background:var(--moss-clump);filter:drop-shadow(0 2px 0 rgba(20,34,12,.7))}
.brand::after{left:10px;right:auto;width:58px;top:-8px;height:18px;background:radial-gradient(circle at 15% 70%,#5f8c3e 0 7px,transparent 7.5px),radial-gradient(circle at 40% 55%,#7aa851 0 7px,transparent 7.5px),radial-gradient(circle at 66% 75%,#6f9b49 0 6px,transparent 6.5px),radial-gradient(circle at 88% 62%,#93bf62 0 4.5px,transparent 5px)}
.num{font-family:var(--px);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--px);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.pxi{width:22px;height:22px;flex:none;display:block;image-rendering:pixelated}

/* ---------- header ---------- */
.top{position:fixed;z-index:20;top:calc(var(--gt) + 12px);left:var(--gl);right:var(--gr);display:flex;align-items:center;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{position:relative;display:flex;align-items:center;gap:9px;height:46px;padding:0 16px 0 12px;white-space:nowrap}
.brand b{font-family:var(--px);font-weight:600;font-size:23px;line-height:1}
.chip{display:flex;align-items:center;gap:9px;height:46px;padding:0 16px 0 12px;white-space:nowrap}
.chip .v{font-family:var(--px);font-size:26px;line-height:1;font-weight:700}
.chip .l{font-family:var(--px);font-size:12.5px;color:var(--on-frame-soft);letter-spacing:.1em}
.spacer{flex:1}
.nav{display:flex;gap:8px}
.navbtn{display:flex;align-items:center;gap:8px;height:46px;padding:0 15px;font-family:var(--px);font-weight:600;font-size:17px;background:var(--bark-tex);border:3px solid var(--ol);border-radius:16px;box-shadow:inset 0 3px 0 var(--frame-hi),inset 0 -4px 0 var(--frame-lo),0 5px 0 var(--ol),0 14px 22px rgba(5,10,8,.42);color:var(--on-frame);text-shadow:0 2px 0 var(--ol);transition:transform .08s,box-shadow .08s,filter .15s}
.navbtn:hover{filter:brightness(1.08)}
.navbtn[aria-pressed="true"]{background:var(--ptex),var(--paper);color:var(--ink);text-shadow:none;transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,248,225,.7),inset 0 -3px 0 rgba(120,80,30,.3),0 2px 0 var(--ol)}
.devbadge{font-family:var(--px);font-size:13px;font-weight:700;letter-spacing:.1em;color:#3d2606;background:var(--gold);border:2.5px solid var(--ol);border-radius:9px;padding:4px 9px;box-shadow:inset 0 2px 0 var(--gold-hi),0 3px 0 var(--ol)}

/* ---------- buttons, chips, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;font-family:var(--px);font-weight:600;font-size:18px;white-space:nowrap;color:var(--ink);background:var(--ptex),var(--paper-2);border:3px solid var(--ol);border-radius:13px;box-shadow:inset 0 3px 0 rgba(255,248,225,.7),inset 0 -4px 0 rgba(120,80,30,.28),0 5px 0 var(--ol);text-shadow:none;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 3px 0 rgba(120,80,30,.3),0 1px 0 var(--ol)}
.btn.primary{flex:1;background:var(--moss);color:#fbf8de;text-shadow:0 2px 0 var(--moss-d);box-shadow:inset 0 3px 0 var(--moss-l),inset 0 -4px 0 var(--moss-d),0 5px 0 var(--ol)}
.btn.primary:active{box-shadow:inset 0 3px 0 var(--moss-d),0 1px 0 var(--ol)}
.btn.danger{background:var(--clay);color:#fff3e6;text-shadow:0 2px 0 var(--clay-d);box-shadow:inset 0 3px 0 var(--clay-l),inset 0 -4px 0 var(--clay-d),0 5px 0 var(--ol)}
.btn.danger:active{box-shadow:inset 0 3px 0 var(--clay-d),0 1px 0 var(--ol)}
.btn.small{height:34px;padding:0 13px;font-size:15px;border-radius:11px;box-shadow:inset 0 2px 0 rgba(255,248,225,.7),inset 0 -3px 0 rgba(120,80,30,.28),0 4px 0 var(--ol)}
.btn.small.primary{box-shadow:inset 0 2px 0 var(--moss-l),inset 0 -3px 0 var(--moss-d),0 4px 0 var(--ol)}
.btn[disabled]{filter:grayscale(.85) brightness(.85);opacity:.8;pointer-events:none}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-soft)}
.icon-btn:hover{background:rgba(90,55,20,.14);color:var(--ink)}
.icon-btn .pxi{width:20px;height:20px}
.pchip{font-family:var(--px);font-weight:500;font-size:15px;line-height:1.3;padding:3px 11px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);background:var(--paper-3);border:2px solid var(--ol-soft);border-radius:9px;box-shadow:0 2px 0 var(--ol-soft);transition:filter .15s}
.pchip .pxi{width:16px;height:16px}
.pchip:hover{filter:brightness(1.06);color:var(--ink)}
.pchip.on{background:var(--moss);color:#f9f6dc;text-shadow:0 2px 0 var(--moss-d);border-color:var(--ol);box-shadow:inset 0 2px 0 var(--moss-l),0 2px 0 var(--ol)}
.seg{display:flex;padding:3px;background:var(--frame-lo);border:2.5px solid var(--ol);border-radius:12px;box-shadow:inset 0 3px 4px rgba(0,0,0,.35)}
.seg button{padding:5px 12px;border-radius:8px;font-family:var(--px);font-size:15px;font-weight:600;color:var(--on-frame-soft);text-shadow:0 2px 0 var(--ol);transition:background .15s}
.seg button.on{background:var(--ptex),var(--paper);color:var(--ink);text-shadow:none;box-shadow:0 2px 0 var(--ol),inset 0 2px 0 rgba(255,248,225,.7)}
.seg button:disabled{opacity:.55;cursor:default}
.custom{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.custom label{display:flex;align-items:center;gap:5px;font-family:var(--px);font-size:13.5px;color:var(--ink-soft)}
.custom input{width:46px;padding:4px 5px;border-radius:9px;border:2px solid var(--ol-soft);background:var(--paper-3);box-shadow:inset 0 3px 4px rgba(60,35,10,.3);text-align:center;font-family:var(--px);font-weight:600;font-size:15px;color:var(--ink);-moz-appearance:textfield;user-select:text;-webkit-user-select:text}
.custom input::-webkit-outer-spin-button,.custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- timer dock ---------- */
.dock{position:fixed;z-index:15;left:var(--gl);bottom:calc(var(--gb) + 16px);width:min(384px,calc(100vw - var(--gl) - var(--gr)))}
.dock>*{margin-left:8px;margin-right:8px}
.dock-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;margin-bottom:10px}
.dock-grid{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.dial{position:relative;width:96px;height:96px}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:rgba(70,42,12,.22);stroke-width:8}
.dial .prog{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 2px 0 var(--gold-d))}
.dial-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.clock{font-family:var(--px);font-size:26px;line-height:1;font-weight:500}
.clock.long{font-size:20px}
.clock-sub{font-family:var(--px);font-size:12px;color:var(--ink-soft);margin-top:4px}
.setup{display:flex;flex-direction:column;gap:9px;min-width:0}
.presets{display:flex;flex-wrap:wrap;gap:4px}
.presets .pchip{padding:2px 8px;font-size:14px}
.status{display:flex;flex-direction:column;gap:3px;min-width:0}
.status .big{font-family:var(--px);font-weight:600;font-size:22px;line-height:1.1}
.status .small{font-family:var(--serif);font-size:15px;color:var(--ink-soft)}
.actions{display:flex;gap:10px;margin-top:12px}
.dock .hint{margin:12px 8px 6px;font-family:var(--px);font-size:12.5px;color:var(--ink-soft);text-align:center}
.dock.min .setup,.dock.min .hint,.dock.min .dock-top .seg{display:none}
.dock.min .dock-grid{grid-template-columns:62px 1fr;align-items:center}
.dock.min .dial{width:62px;height:62px}
.dock.min .clock{font-size:16px}
.dock.min .clock-sub{display:none}
.dock.min .actions{margin-top:0}
.dock.min .dock-top{margin:0;position:absolute;right:14px;top:14px;z-index:2}
.dock.min{padding:12px}
.dock.min .dock-grid{margin-top:14px;margin-bottom:12px}
.dock.min .actions{margin-top:0}

.dock.min #dockMin .pxi{transform:rotate(180deg)}

/* ---------- drawer ---------- */
.panel{position:fixed;z-index:25;top:calc(var(--gt) + 76px);bottom:calc(var(--gb) + 16px);right:var(--gr);width:min(420px,calc(100vw - var(--gl) - var(--gr)));display:flex;flex-direction:column;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ptabs{display:flex;align-items:flex-end;gap:6px;padding:14px 12px 0;border-bottom:3px solid var(--ol-soft);margin:0 2px}
.ptab{font-family:var(--px);font-weight:600;font-size:16px;padding:6px 14px 7px;margin-bottom:-3px;color:var(--ink-soft);background:var(--paper-3);border:2.5px solid var(--ol-soft);border-bottom:0;border-radius:10px 10px 0 0;box-shadow:inset 0 3px 0 rgba(255,248,225,.45);transition:filter .15s}
.ptab:hover{filter:brightness(1.06);color:var(--ink)}
.ptab[aria-selected="true"]{background:var(--ptex),var(--paper);color:var(--ink);padding-bottom:10px;border-color:var(--ol);box-shadow:inset 0 3px 0 rgba(255,248,225,.7)}
.pclose{margin-left:auto;margin-bottom:6px}
.pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 18px;scrollbar-width:thin;scrollbar-color:var(--ol-soft) transparent;margin:0 2px}
.pbody h3{font-family:var(--px);font-weight:700;font-size:24px;line-height:1.1;margin:0 0 4px}
.pbody p.sub{margin:0 0 14px;color:var(--ink-soft);font-size:15px;line-height:1.3}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 11px}
.item{position:relative;display:flex;flex-direction:column;text-align:left;padding:8px 8px 10px;min-width:0;background:var(--ptex),var(--paper-2);border:2.5px solid var(--ol-soft);border-radius:13px;box-shadow:inset 0 3px 0 rgba(255,248,225,.5),0 4px 0 var(--ol-soft);transition:transform .1s,filter .15s}
.item:hover{transform:translateY(-2px);filter:brightness(1.04)}
.item .pv{width:100%;height:104px;display:block;background:radial-gradient(ellipse at 50% 108%,var(--pv-ground),transparent 70%),linear-gradient(var(--pv-top),var(--pv-bot));border:2px solid var(--ol-soft);border-radius:9px;box-shadow:inset 0 4px 7px rgba(60,35,10,.4)}
.item .nm{font-family:var(--px);font-weight:600;font-size:18px;line-height:1.1;margin:8px 3px 0}
.item .meta{display:flex;align-items:center;justify-content:space-between;margin:4px 3px 0;gap:6px}
.cost{display:inline-flex;align-items:center;gap:5px;font-family:var(--px);font-weight:700;font-size:17px;color:var(--moss-d)}
.cost .pxi{width:16px;height:16px}
.item .gr{font-family:var(--px);font-size:12.5px;color:var(--ink-soft)}
.item .note{margin:3px 3px 0;font-size:14px;line-height:1.2;color:var(--ink-soft)}
.item[data-state="poor"] .cost{color:var(--danger)}
.item[data-state="poor"] .pv{opacity:.72}
.item[data-state="locked"]{cursor:default}
.item[data-state="locked"]:hover{transform:none;filter:none}
.item[data-state="locked"] .pv{filter:grayscale(1) brightness(.6) contrast(1.05)}
.item[data-state="locked"] .nm{color:var(--ink-soft)}
.item[data-state="sel"]{border-color:var(--ol);background:var(--ptex),var(--sel-bg);box-shadow:inset 0 3px 0 rgba(255,248,225,.55),0 4px 0 var(--ol),0 0 0 3px var(--gold)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 11px;margin-bottom:18px}
.stat{padding:10px 14px;background:var(--ptex),var(--paper-2);border:2.5px solid var(--ol-soft);border-radius:13px;box-shadow:inset 0 3px 0 rgba(255,248,225,.5),0 4px 0 var(--ol-soft)}
.stat .v{font-family:var(--px);font-size:28px;line-height:1.05;font-weight:500;margin-top:3px}
.stat .v small{font-size:15px;color:var(--ink-soft);margin-left:2px}
.week{display:flex;align-items:flex-end;gap:8px;height:84px;margin:10px 0 20px;padding:0 2px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;min-width:0}
.week .bar{width:100%;border:2px solid var(--ol);border-bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(var(--moss-l),var(--moss));box-shadow:inset 0 2px 0 rgba(255,255,255,.35);min-height:5px}
.week .d.today .bar{background:linear-gradient(var(--gold-hi),var(--gold))}
.week .lb{font-family:var(--px);font-size:12px;color:var(--ink-soft)}
.heatscroll{overflow-x:auto;padding:4px 2px 10px;margin:8px -2px 0;scrollbar-width:thin;scrollbar-color:var(--ol-soft) transparent}
.heat{width:max-content}
.hmonths,.hgrid{display:grid;grid-template-columns:repeat(53,13px);gap:3px}
.hmonths{margin-bottom:4px;font-family:var(--px);font-size:12px;color:var(--ink-soft);height:14px}
.hmonths span{white-space:nowrap;overflow:visible}
.hgrid{grid-template-rows:repeat(7,13px);grid-auto-flow:column}
.hc{width:13px;height:13px;padding:0;display:block;border-radius:3px;border:2px solid var(--ol-soft);background:var(--paper-3);box-shadow:inset 0 2px 3px rgba(60,35,10,.28)}
.hc.off{visibility:hidden}
.hc.future{background:transparent;border:2px dashed rgba(107,90,56,.35);box-shadow:none}
.hc.t1{background:#b9cb86;border-color:#6f8247;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.hc.t2{background:#8fb55f;border-color:#4d6f2f;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.hc.t3{background:#5f9340;border-color:#2f5420;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.hc.t4{background:var(--gold);border-color:var(--gold-d);box-shadow:inset 0 2px 0 var(--gold-hi)}
.hc.today{outline:2px dotted var(--ink);outline-offset:1px}
.hc.sel{outline:2px solid var(--ink);outline-offset:1px}
button.hc{cursor:pointer}
.heatread{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px;flex-wrap:wrap}
.heatread b{font-family:var(--px);font-size:18px;font-weight:600}
.hleg{display:inline-flex;align-items:center;gap:3px;font-family:var(--px);font-size:12px;color:var(--ink-soft)}
.hleg .hc{margin:0}
.hleg .hc:first-of-type{margin-left:5px}.hleg .hc:last-of-type{margin-right:5px}
.ms{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:12px 0;border-top:2px dashed rgba(107,90,56,.4)}
.ms .mk{width:26px;height:26px;border-radius:50%;background:var(--paper-3);border:2.5px solid var(--ol);display:grid;place-items:center;color:#fff;margin-top:2px;box-shadow:inset 0 2px 4px rgba(60,35,10,.3)}
.ms .mk .pxi{width:16px;height:16px}
.ms.done .mk{background:var(--moss);box-shadow:inset 0 2px 0 var(--moss-l)}
.ms.next .mk{background:var(--gold);box-shadow:inset 0 2px 0 var(--gold-hi),0 0 0 3px rgba(223,166,62,.35)}
.ms .t{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ms .nm{font-family:var(--px);font-size:18px;font-weight:600;line-height:1.15}
.ms .at{font-size:14px;color:var(--ink-soft);white-space:nowrap}
.ms .ds{font-size:14px!important;line-height:1.25}
.ms .rw{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.rw span{font-family:var(--px);font-size:12.5px;padding:2px 9px;border-radius:8px;background:var(--paper-3);border:2px solid var(--ol-soft);color:var(--ink-soft)}
.ms.done .rw span{color:var(--ink);background:var(--paper-2)}
.ms:not(.done):not(.next) .nm{color:var(--ink-soft)}
.meter{height:14px;border-radius:8px;background:var(--frame-lo);border:2.5px solid var(--ol);margin-top:9px;overflow:hidden;box-shadow:inset 0 3px 4px rgba(0,0,0,.4)}
.meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(var(--gold-hi),var(--gold) 45%,var(--gold-d));border-right:2px solid var(--ol)}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 11px;margin-bottom:22px}
.wx{text-align:left;padding:7px 7px 9px;background:var(--ptex),var(--paper-2);border:2.5px solid var(--ol-soft);border-radius:13px;box-shadow:inset 0 3px 0 rgba(255,248,225,.5),0 4px 0 var(--ol-soft);transition:transform .1s,filter .15s;min-width:0}
.wx:hover{transform:translateY(-2px);filter:brightness(1.04)}
.wx i{display:flex;align-items:flex-end;justify-content:flex-end;height:42px;padding:4px;border-radius:8px;border:2px solid var(--ol-soft);box-shadow:inset 0 3px 5px rgba(0,0,0,.25)}
.wx i .pxi{width:30px;height:30px}
.wx b{display:block;font-family:var(--px);font-size:17px;font-weight:600;margin:8px 3px 0;line-height:1.1}
.wx span{display:block;font-size:13.5px;color:var(--ink-soft);margin:3px 3px 0;line-height:1.2}
.wx[aria-pressed="true"]{border-color:var(--ol);background:var(--ptex),var(--sel-bg);box-shadow:inset 0 3px 0 rgba(255,248,225,.55),0 4px 0 var(--ol),0 0 0 3px var(--gold)}
.wx.locked{cursor:default}
.wx.locked:hover{transform:none;filter:none}
.wx.locked i{filter:grayscale(1) brightness(.55)}
.wx.locked b{color:var(--ink-soft)}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding:10px 0;border-top:2px dashed rgba(107,90,56,.4)}
.row .lb{font-family:var(--px);font-weight:600;font-size:16px}
.row .ds{font-size:14px;color:var(--ink-soft)}
.row input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:8px;background:var(--frame-lo);border:3px solid var(--ol);box-shadow:inset 0 3px 4px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:8px;background:var(--frame-lo);border:3px solid var(--ol)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);margin-top:-8px;border:3px solid var(--ol);box-shadow:inset 0 2px 0 #fff8e1,0 2px 0 var(--ol)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--ol)}
.sw{position:relative;width:50px;height:28px;border-radius:999px;background:var(--frame-lo);border:3px solid var(--ol);box-shadow:inset 0 3px 4px rgba(0,0,0,.4);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:1px;top:1px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ol);box-shadow:inset 0 2px 0 #fff8e1;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--moss)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
textarea.save{width:100%;height:84px;border-radius:12px;border:2px solid var(--ol-soft);background:var(--paper-3);box-shadow:inset 0 3px 4px rgba(60,35,10,.3);padding:9px 11px;font-family:var(--mono);font-size:11px;color:var(--ink);resize:vertical;user-select:text;-webkit-user-select:text}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* ---------- hint, toasts, inspector, dialogs ---------- */
.placehint{position:fixed;z-index:19;top:calc(var(--gt) + 72px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 8px 6px 18px;border-radius:18px;font-family:var(--px);font-size:15px;width:max-content;max-width:calc(100vw - 32px);animation:rise .25s ease}
.placehint b{font-weight:700;color:var(--gold-hi)}
.toasts{position:fixed;z-index:40;top:calc(var(--gt) + 78px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.toast{padding:8px 20px;border-radius:999px;font-family:var(--px);font-size:16px;font-weight:600;max-width:calc(100vw - 32px);text-align:center;animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both;background:var(--moss);color:#fbf8de;text-shadow:0 2px 0 var(--moss-d);box-shadow:inset 0 3px 0 var(--moss-l),inset 0 -4px 0 var(--moss-d),0 5px 0 var(--ol),0 14px 22px rgba(5,10,8,.4)}
.toast.warm{background:var(--gold);color:#3d2606;text-shadow:none;box-shadow:inset 0 3px 0 var(--gold-hi),inset 0 -4px 0 var(--gold-d),0 5px 0 var(--ol),0 14px 22px rgba(5,10,8,.4)}
.toast.out{animation:toastOut .4s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px)}}
.insp{position:fixed;z-index:30;width:244px;padding:12px;animation:rise .2s ease}
.insp>*{margin-left:8px;margin-right:8px}
.insp h4{margin:8px 8px 0;font-family:var(--px);font-size:21px;font-weight:700;line-height:1.1}
.insp .st{font-family:var(--px);font-size:14px;color:var(--moss-d);margin-top:3px;margin-bottom:10px;font-weight:600}
.insp .ds{font-size:14px!important;line-height:1.25}
.insp .bt{display:flex;gap:8px;margin-top:14px;margin-bottom:6px}
.insp .bt .btn{flex:1;height:36px;padding:0 8px;font-size:14px;border-radius:11px}
.modalwrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 20px 20px;background:rgba(10,8,4,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{position:relative;width:min(440px,100%);text-align:center;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.mbody{padding:30px 26px 24px;max-height:calc(100vh - 110px);overflow-y:auto}
.modal h2{font-family:var(--px);font-weight:700;font-size:30px;margin:0 0 4px;line-height:1.1}
.modal .gain{font-family:var(--px);font-size:64px;line-height:1;color:var(--gold-d);font-weight:700;margin:12px 0 2px}
.modal .gain small{font-size:22px;color:var(--ink-soft);margin-left:6px;font-weight:500}
.modal p{margin:6px 0;color:var(--ink-soft);font-size:16px}
.unlocks{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px;text-align:left}
.unl{padding:10px 14px;border-radius:13px;border:2.5px solid var(--ol-soft);background:var(--ptex),var(--paper-2);box-shadow:inset 0 3px 0 rgba(255,248,225,.5),0 4px 0 var(--ol-soft)}
.unl b{font-family:var(--px);font-size:19px;font-weight:600;display:block;line-height:1.15}
.unl span{font-size:14.5px;color:var(--ink-soft);line-height:1.3;display:block;margin-top:2px}
.modal .btn{margin-top:20px;width:100%}

/* ---------- dev panel (utility, kept plain) ---------- */
.dev{position:fixed;z-index:35;left:var(--gl);top:calc(var(--gt) + 76px);width:min(292px,calc(100vw - var(--gl) - var(--gr)));max-height:max(170px,calc(100% - 76px - var(--gt) - 380px));overflow-y:auto;padding:6px 12px 12px;border-radius:14px;background:rgba(24,15,8,.94);border:3px solid var(--ol);box-shadow:0 5px 0 var(--ol),0 14px 22px rgba(5,10,8,.4);font-family:var(--mono);font-size:11.5px;color:#f0d49a;animation:rise .2s ease}
.dev details{border-bottom:1px solid rgba(223,166,62,.2);padding:2px 0 6px}
.dev summary{cursor:pointer;list-style:none;padding:6px 2px;font-size:10.5px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;display:flex;justify-content:space-between}
.dev summary::-webkit-details-marker{display:none}
.dev summary::after{content:'+';opacity:.7}
.dev details[open] summary::after{content:'\2212'}
.dev .g{display:flex;flex-wrap:wrap;gap:5px}
.dev button.d{padding:6px 9px;border-radius:7px;border:1px solid rgba(223,166,62,.4);color:#f6dcb0;font-size:11px;font-family:var(--mono)}
.dev button.d:hover{background:rgba(223,166,62,.16)}
.dev button.d.on{background:var(--gold);color:#3d2606}
.dev label{display:flex;align-items:center;gap:8px;color:#e9cfa0;margin-top:6px}
.dev label span{width:62px;flex:none}
.dev select{background:#1c1409;color:#f6dcb0;border:1px solid rgba(223,166,62,.4);border-radius:7px;padding:5px;font-family:var(--mono);font-size:11px;flex:1;min-width:0}
.dev input[type=range]{height:18px}
.dev input[type=range]::-webkit-slider-runnable-track{height:5px;border:0;background:rgba(223,166,62,.3);box-shadow:none}
.dev input[type=range]::-webkit-slider-thumb{width:14px;height:14px;margin-top:-5px;border:0;background:var(--gold);box-shadow:none}

.savebadge{position:fixed;z-index:12;right:var(--gr);bottom:calc(var(--gb) + 6px);font-family:var(--px);font-size:12px;color:var(--on-frame-soft);text-shadow:0 1px 0 var(--ol);letter-spacing:.04em;pointer-events:none;opacity:.8}
.savebadge.warn{color:#f0a48f;opacity:1}

@media (max-width:720px){
  .brand{padding:0 12px 0 10px}
  .brand .w{display:none}
  .navbtn span{display:none}
  .navbtn{padding:0 11px}
  .chip{padding:0 12px 0 10px}
  .chip .v{font-size:23px}
  .chip.life{display:none}
  .chip .l{display:none}
  .chip{padding:0 14px 0 10px}
  .top{gap:10px}
  .nav{gap:6px}
  .panel{top:auto;left:var(--gl);right:var(--gr);width:auto;height:min(72%,600px);bottom:calc(var(--gb) + 12px)}
  .dock{width:auto;right:var(--gr);bottom:calc(var(--gb) + 12px)}
  .dock-grid{grid-template-columns:92px 1fr;gap:10px}
  .dial{width:92px;height:92px}
  .clock{font-size:24px}
  .savebadge{display:none}
}
@media (max-width:720px) and (max-height:640px){
  .dock:not(.min) .hint{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

}

/* ---------- placement hint ---------- */
function renderPlaceHint() {
  const h = el.placeHint;
  if (UI.placing) { const it = ITEMS[UI.placing]; h.innerHTML = `<span>Planting <b>${esc(it.name)}</b> · ${nf(it.cost)} tokens · tap a free plot</span><button class="btn small ghost" data-act="cancelPlace">Done</button>`; h.hidden = false; cv.classList.add('place'); }
  else if (UI.moving) { const p = S.plants.find(q => q.id === UI.moving); h.innerHTML = `<span>Moving <b>${esc(p ? ITEMS[p.item].name : '')}</b> · tap a free plot</span><button class="btn small ghost" data-act="cancelPlace">Cancel</button>`; h.hidden = false; cv.classList.add('place'); }
  else { h.hidden = true; cv.classList.remove('place'); }
}
function cancelPlace() { UI.placing = null; UI.moving = null; UI.hover = -1; renderPlaceHint(); refreshPanel(); }
function selectItem(id) {
  const it = ITEMS[id], st = itemState(it);
  if (st === 'locked') { toast(`${it.name} opens at ${nf(itemUnlockAt(id))} min of focus`); return; }
  if (st === 'poor') { toast(`Needs ${nf(it.cost - S.tokens)} more tokens`); return; }
  UI.placing = UI.placing === id ? null : id; UI.moving = null; closeInspector(); renderPlaceHint(); refreshPanel();
  if (UI.placing && window.innerWidth <= 720) closePanel();
}

/* ---------- canvas interaction ---------- */
function handleSceneClick(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  if (UI.placing) {
    const si = pickSlotAt(wx, wy, false);
    if (si < 0) return;
    const r = placeItem(UI.placing, si), it = ITEMS[UI.placing];
    if (r === 'taken') toast('That plot is taken');
    else if (r === 'poor') toast(`Needs ${nf(it.cost - S.tokens)} more tokens`);
    else if (r === 'ok') {
      if (S.tokens < it.cost) { UI.placing = null; renderPlaceHint(); toast(`${it.name} planted`, true); } else toast(`${it.name} planted`, true);
      refreshPanel();
    }
    return;
  }
  if (UI.moving) {
    const si = pickSlotAt(wx, wy, true);
    if (si >= 0 && movePlant(UI.moving, si)) { UI.moving = null; UI.hover = -1; renderPlaceHint(); }
    return;
  }
  const pl = pickPlantAt(wx, wy);
  if (pl) openInspector(pl.id); else closeInspector();
}
function setupPointer() {
  let ptr = null;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, drag: false }; });
  cv.addEventListener('pointermove', e => {
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    if (ptr && ptr.id === e.pointerId) {
      if (!ptr.drag && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 7) { ptr.drag = true; cv.classList.add('drag'); closeInspector(); }
      if (ptr.drag) { panBy(e.clientX - ptr.lx); ptr.lx = e.clientX; }
    }
    UI.hover = (UI.placing || UI.moving) ? pickSlotAt(wx, wy, true) : -1;
  });
  const end = e => { if (ptr && ptr.id === e.pointerId) { const was = ptr.drag; ptr = null; cv.classList.remove('drag'); if (!was && e.type === 'pointerup') handleSceneClick(e.clientX, e.clientY); } };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', () => { if (!ptr) UI.hover = -1; });
  cv.addEventListener('wheel', e => { e.preventDefault(); panBy(-(Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY)); closeInspector(); }, { passive: false });
}

/* ---------- inspector ---------- */
function openInspector(id) {
  const p = S.plants.find(q => q.id === id); if (!p) return;
  UI.sel = id; el.inspector.hidden = false; fillInspector(); positionInspector(p);
}
function closeInspector() { UI.sel = null; el.inspector.hidden = true; }
function fillInspector() {
  const p = S.plants.find(q => q.id === UI.sel); if (!p) return closeInspector();
  const it = ITEMS[p.item], g = growthOf(p), st = stageOf(g); let body = '';
  if (it.grow) {
    const age = Math.max(0, liveFocusMs() / 60000 - p.at + S.devf.bonusMin), thr = it.grow[Math.min(st, 2)], frac = st >= 3 ? 1 : g - st;
    body = `<div class="st">${STAGE_NAMES[st]} · stage ${st + 1} of 4</div><div class="meter"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>
      <div class="ds" style="color:var(--muted);margin-top:6px">${st >= 3 ? 'Fully grown. It thrives on quiet.' : `About ${nf(Math.max(1, Math.ceil(thr - age)))} more focus min to ${STAGE_NAMES[st + 1].toLowerCase()}`}</div>`;
  } else body = `<div class="st">Keepsake</div><div class="ds" style="color:var(--muted)">${esc(it.desc)}</div>`;
  el.inspector.innerHTML = `<h4>${esc(it.name)}</h4>${body}<div class="bt"><button class="btn ghost" data-act="movePlant">Move</button><button class="btn danger" data-act="removePlant">Remove +${Math.floor(it.cost / 2)}</button></div>`;
}
function positionInspector(p) {
  const s = SLOTS[p.slot], hb = hitBox(p, growthOf(p)), [sx, sy] = toScreen(s.x, s.y - hb.hh * .55);
  const w = 236, h = el.inspector.offsetHeight || 150; let x = sx + hb.hw * SC + 14; if (x + w > VW - 12) x = sx - hb.hw * SC - 14 - w;
  el.inspector.style.left = clamp(x, 10, VW - w - 10) + 'px'; el.inspector.style.top = clamp(sy - h / 2, 70, VH - h - 20) + 'px';
}

/* ---------- modals ---------- */
function showModal(html) { el.modalWrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mbody">${html}</div></div>`; el.modalWrap.hidden = false; const b = $('button.btn', el.modalWrap); if (b) b.focus(); }
function closeModal() { el.modalWrap.hidden = true; el.modalWrap.innerHTML = ''; }
function unlockCards(list) {
  return list.map(m => {
    const rw = [...(m.items || []).map(i => ITEMS[i].name), ...(m.weather || []).map(w => WEATHERS[w].name + ' weather'), ...(m.region ? [REGIONS[m.region].name + ' opens'] : [])];
    return `<div class="unl"><b>${esc(m.name)}</b><span>${esc(rw.join(' · '))}</span></div>`;
  }).join('');
}
function showSessionModal(o) {
  const title = o.dev ? 'Milestone reached' : o.away ? 'Welcome back' : o.early ? 'Session ended' : 'Session complete';
  const sub = o.dev ? '' : o.away ? 'Your timer finished while you were away.' : o.early ? 'Every whole minute still counts.' : 'The garden drank it all in.';
  el.modalWrap.dataset.kind = 'session';
  showModal(`<h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}${o.dev ? '' : `<div class="gain num">+${nf(o.tokens)}<small>token${o.tokens === 1 ? '' : 's'}</small></div><p>${fmtDur(o.ms / 60000)} of focus</p>`}
    ${o.unlocked && o.unlocked.length ? `<div class="unlocks">${unlockCards(o.unlocked)}</div>` : ''}<button class="btn primary" data-act="closeModal">Back to the garden</button>`);
}
function showIntro() {
  showModal(`<h2>Welcome to Rootwork</h2><p>Focus, and your garden grows.</p>
    <div class="unlocks" style="margin-top:14px">
      <div class="unl"><b>Study to earn</b><span>Start a timer or stopwatch. Every full minute becomes 1 token, even if you switch tabs.</span></div>
      <div class="unl"><b>Plant and decorate</b><span>Open the shop, choose a plant, then tap a free plot. Plants grow while you focus.</span></div>
      <div class="unl"><b>Look around</b><span>Drag the scene sideways. Milestones open new weather, plants and land.</span></div></div>
    <button class="btn primary" data-act="closeIntro">Begin</button>`);
}

/* ---------- dev panel ---------- */
function applyDevUI() { el.devBadge.hidden = !S.set.dev; el.devPanel.hidden = !S.set.dev; if (S.set.dev) renderDevPanel(); }
function renderDevPanel() {
  const f = S.devf, b = (a, l, on) => `<button class="d${on ? ' on' : ''}" data-dev="${a}">${l}</button>`;
  const open = renderDevPanel.open || (renderDevPanel.open = { Tokens: true, Timer: true, Progress: true });
  const sec = (n, inner) => `<details data-sec="${n}"${open[n] ? ' open' : ''}><summary>${n}</summary>${inner}</details>`;
  const H = x => x.replace(/<h5>(\w+)<\/h5>/, '');
  el.devPanel.innerHTML =
    sec('Tokens', `<div class="g">${b('tokens:10', '+10')}${b('tokens:100', '+100')}${b('tokens:1000', '+1000')}${b('tokens:-9999999', 'zero')}</div>`) +
    sec('Timer', `<div class="g">${b('complete', 'complete now')}${b('skip:5', '+5 min')}${b('skip:30', '+30 min')}${b('skip:120', '+2 h')}</div>`) +
    sec('Progress', `<div class="g">${b('unlock', 'unlock all', f.unlockAll)}${b('life:100', 'life +100m')}${b('life:1000', 'life +1000m')}</div>`) +
    sec('Growth', `<div class="g">${b('grow:50', 'grow +50m')}${b('grow:500', 'grow +500m')}${b('force:auto', 'auto', f.force == null)}${b('force:.5', 'seed', f.force === .5)}${b('force:1.5', 'young', f.force === 1.5)}${b('force:2.5', 'mature', f.force === 2.5)}${b('force:3', 'full', f.force === 3)}${b('growreset', 'reset')}</div>`) +
    sec('Weather', `<label><span>force</span><select id="devWx">${WEATHER_ORDER.map(id => `<option value="${id}"${S.set.weather === id ? ' selected' : ''}>${WEATHERS[id].name}</option>`).join('')}</select></label>
      <label><span>rain</span><input type="range" id="devRain" min="0" max="1" step="0.01" value="${Wt.rain || 0}"></label><label><span>wind</span><input type="range" id="devWind" min="0" max="1.3" step="0.01" value="${Wt.wind || 0}"></label>
      <div class="g" style="margin-top:6px">${b('strike', 'lightning')}</div>`) +
    sec('Garden', `<div class="g">${b('fill', 'fill all plots')}${b('clear', 'clear garden')}</div>`) +
    `<div class="g" style="margin-top:10px">${b('close', 'exit dev mode')}</div>`;
  $$('details', el.devPanel).forEach(d => d.addEventListener('toggle', () => { open[d.dataset.sec] = d.open; }));
}
const DEV_ACT = {
  tokens: n => devAddTokens(+n), life: n => devAddLifetime(+n), skip: n => devSkip(+n), complete: () => devComplete(),
  unlock: () => { S.devf.unlockAll = !S.devf.unlockAll; saveNow(); refreshPanel(true); renderDevPanel(); toast(S.devf.unlockAll ? 'Everything unlocked' : 'Locks restored', true); },
  grow: n => { S.devf.bonusMin += +n; saveNow(); toast(`Plants aged +${n} min`); },
  growreset: () => { S.devf.bonusMin = 0; S.devf.force = null; saveNow(); renderDevPanel(); },
  force: n => { S.devf.force = n === 'auto' ? null : +n; saveNow(); renderDevPanel(); },
  strike: () => strike(), fill: () => devFill(), clear: () => devClear(), close: () => setDev(false)
};

/* ============================================================
   Boot
   ============================================================ */
function wireEvents() {
  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-act]'); if (!t) { return; }
    if (t.dataset.tab) { togglePanel(t.dataset.tab); return; }
    if (t.dataset.ptab) { openPanel(t.dataset.ptab); return; }
    if (t.id === 'panelClose') { closePanel(); return; }
    if (t.dataset.mode) { if (S.timer.status === 'idle') { S.timer.mode = t.dataset.mode; saveSoon(); renderDock(true); } return; }
    if (t.dataset.preset) { S.timer.targetMs = +t.dataset.preset * 60000; saveSoon(); renderDock(true); return; }
    if (t.id === 'btnMain') { const s = S.timer.status; s === 'running' ? pauseTimer() : startTimer(); return; }
    if (t.id === 'btnEnd') { onEnd(); return; }
    if (t.id === 'dockMin') { S.set.dockMin = !S.set.dockMin; saveSoon(); renderDock(true); return; }
    if (t.dataset.day) { pickDay(t.dataset.day); return; }
    if (t.dataset.filter) { shopFilter = t.dataset.filter; renderPanel(true); return; }
    if (t.dataset.item && t.classList.contains('item')) { selectItem(t.dataset.item); return; }
    if (t.dataset.weather) { if (!isWeatherUnlocked(t.dataset.weather)) { toast(`Opens at ${nf(weatherUnlockAt(t.dataset.weather))} min of focus`); return; } setWeather(t.dataset.weather); renderPanel(true); if (S.set.dev) renderDevPanel(); return; }
    if (t.dataset.ch) { const k = t.dataset.ch; setChannel(k, !S.set.ch[k].on); t.setAttribute('aria-checked', String(S.set.ch[k].on)); return; }
    if (t.hasAttribute('data-chime')) { S.set.chime = !S.set.chime; t.setAttribute('aria-checked', String(S.set.chime)); if (S.set.chime) playChime(); saveSoon(); return; }
    if (t.dataset.dev) { const [a, ...r] = t.dataset.dev.split(':'); const fn = DEV_ACT[a]; if (fn) fn(r.join(':')); return; }
    const act = t.dataset.act;
    if (act === 'setCustom') setCustomTime();
    else if (act === 'cancelPlace') cancelPlace();
    else if (act === 'closeModal') closeModal();
    else if (act === 'closeIntro') { S.intro = true; saveNow(); closeModal(); }
    else if (act === 'movePlant') { UI.moving = UI.sel; UI.placing = null; closeInspector(); UI.hover = -1; renderPlaceHint(); }
    else if (act === 'removePlant') { const r = removePlant(UI.sel); closeInspector(); toast(`Removed. +${r} tokens back`); }
    else if (act === 'export') { const ta = document.getElementById('saveText'); ta.value = exportSave(); ta.focus(); ta.select(); try { navigator.clipboard.writeText(ta.value).then(() => toast('Save copied'), () => toast('Save is in the box. Copy it from there.')); } catch (er) { toast('Save is in the box. Copy it from there.'); } }
    else if (act === 'import') { const ta = document.getElementById('saveText'); if (!ta.value.trim()) { toast('Paste your save into the box first'); return; } const err = importSave(ta.value.trim()); if (err) toast(err); else { toast('Save loaded', true); } }
    else if (act === 'reset') {
      if (!t._armed) { t._armed = true; t.textContent = 'Tap again to erase everything'; setTimeout(() => { t._armed = false; t.textContent = 'Reset garden'; }, 4000); }
      else { resetAll(); toast('Garden reset'); renderPanel(true); }
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.vol) setChannelVol(t.dataset.vol, +t.value);
    else if (t.hasAttribute('data-master')) setMaster(+t.value);
    else if (t.id === 'devRain') Wt.rain = +t.value;
    else if (t.id === 'devWind') Wt.wind = +t.value;
  });
  document.addEventListener('change', e => { if (e.target.id === 'devWx') devForceWeather(e.target.value); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.target.id === 'inH' || e.target.id === 'inM')) { setCustomTime(); return; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); setDev(!S.set.dev); toast(S.set.dev ? 'Dev mode on' : 'Dev mode off', true); return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Escape') {
      if (!el.modalWrap.hidden) { if (el.modalWrap.dataset.kind !== 'x') closeModal(); } else if (UI.placing || UI.moving) cancelPlace(); else if (!el.inspector.hidden) closeInspector(); else if (panelTab) closePanel();
    } else if (e.key === 'ArrowLeft') panBy(90); else if (e.key === 'ArrowRight') panBy(-90);
  });
  el.modalWrap.addEventListener('click', e => { if (e.target === el.modalWrap) { if (!S.intro) { S.intro = true; saveNow(); } closeModal(); } });
  let taps = 0, tapT = 0;
  el.brand.addEventListener('click', () => { const n = performance.now(); taps = n - tapT < 2200 ? taps + 1 : 1; tapT = n; if (taps >= 5) { taps = 0; setDev(!S.set.dev); toast(S.set.dev ? 'Dev mode on' : 'Dev mode off', true); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); else { timerTick(); renderHeader(); } });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('online', saveNow); window.addEventListener('offline', saveNow);
}

function boot() {
  loadState();
  if (/(^|[#&])dev($|&)/.test(location.hash)) S.set.dev = true;
  S.timer.mode = S.timer.mode === 'stopwatch' ? 'stopwatch' : 'countdown';
  startScene(); setupPointer(); wireEvents(); armAudioOnGesture(); initTimerWorker();
  renderHeader(); renderDock(true); applyDevUI(); renderPlaceHint(); saveNow();
  for (const p of S.plants) lastStage.set(p.id, stageOf(growthOf(p)));
  afterLoadTimerCheck();
  setInterval(stageWatch, 500);
  setInterval(() => { renderHeader(); if (!el.inspector.hidden) fillInspector(); if (S.timer.status !== 'idle') saveSoon(); }, 1000);
  setInterval(audioTick, 1000);
  setInterval(() => { if (panelTab === 'journey') refreshPanel(); }, 15000);
  if (!S.intro) setTimeout(showIntro, 600);
  window.__grove = { S: () => S, W, ITEMS, ITEM_ORDER, SLOTS, setWeather, devFill, placeItem, strike, getSprite, spriteBounds, SPR, openInspector, closeInspector, toast, showSessionModal, MILESTONES, setDev };
}
boot();


})();
</script>
